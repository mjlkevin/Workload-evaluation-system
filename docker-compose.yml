# ============================================================
# 生产编排：API + PostgreSQL + Web（nginx）
# 使用：docker compose up -d --build
# ============================================================

services:
  db:
    image: postgres:17-alpine
    container_name: workload-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workload}
      POSTGRES_DB: ${POSTGRES_DB:-workload_eval}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workload} -d ${POSTGRES_DB:-workload_eval}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: workload-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 确保容器内数据库地址指向 db 服务
      DATABASE_URL: ${DATABASE_URL:-postgres://workload:workload@db:5432/workload_eval}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgres://workload:workload@db:5432/workload_eval_test}
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./config:/repo/config
      - ./apps/api/drizzle:/repo/apps/api/drizzle:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # web service 已下线（apps/web W4 Vue 工作台已删除）
  # 旧前端 ui/V0_SAAS（Next.js）暂用 host 模式启动，未容器化
  # 新前端待基于 V0_SAAS 重建，详见 docs/TODO_V0_SAAS_FRONTEND.md

volumes:
  pg_data:
