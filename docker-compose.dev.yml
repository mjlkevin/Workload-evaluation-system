# ============================================================
# 开发覆盖：源码热重载 + Vite Dev Server
# 使用：docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      target: deps
    command: ["npx", "tsx", "watch", "src/main.ts"]
    volumes:
      - ./apps/api:/repo/apps/api
      - ./config:/repo/config
      - ./drizzle:/repo/drizzle
    environment:
      NODE_ENV: development
      CONFIG_INTEGRITY_ON_STARTUP: "false"
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      - ./apps/web:/repo/apps/web
      - /repo/apps/web/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_API_PROXY_TARGET=http://api:3000
    depends_on:
      - api
