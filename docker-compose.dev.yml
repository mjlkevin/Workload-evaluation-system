# ============================================================
# 开发覆盖：源码热重载 + Vite Dev Server
# 使用：docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      target: deps
    command: ["npx", "tsx", "watch", "src/main.ts"]
    volumes:
      - ./apps/api:/repo/apps/api
      - ./config:/repo/config
      - ./apps/api/drizzle:/repo/apps/api/drizzle
    environment:
      NODE_ENV: development
      CONFIG_INTEGRITY_ON_STARTUP: "false"
    ports:
      - "3000:3000"

  # web 容器已下线（apps/web W4 Vue 工作台已删除；ui/V0_SAAS 旧 Next.js 前端已清理）
  # 当前 Web 前端为 ui/V2_PROTOTYPE（Vite + React），开发期请直接 npm run dev:web（端口 :3002）
