                delayReason:
                  type: string
                riskTags:
                  type: array
                  items:
                    type: string
                closedAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: 结项成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryProjectResponse"
