<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="WES Workbench component preview strip: buttons, inputs, status tags, KPI card, table excerpt and tabs bound to the wes-workbench token set. Full fixture lives in ../components.html." />
<title>WES Workbench — Components Preview</title>
<style>
:root {
  --bg: oklch(0.985 0.004 250);
  --surface: #fff;
  --fg: oklch(0.21 0.03 260);
  --fg-2: oklch(0.42 0.02 260);
  --muted: oklch(0.62 0.012 260);
  --border: oklch(0.92 0.008 255);
  --border-soft: var(--border);
  --accent: oklch(0.42 0.14 262);
  --accent-on: #ffffff;
  --accent-active: color-mix(in oklab, var(--brand-ink), black 10%);
  --success: oklch(0.66 0.13 152);
  --warn: oklch(0.78 0.13 80);
  --danger: oklch(0.62 0.2 25);
  --font-display: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --text-xs: 11.5px;
  --text-sm: 12.5px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-2xl: 20px;
  --text-3xl: 28px;
  --leading-body: 1.6;
  --leading-tight: 1.3;
  --tracking-display: -0.01em;
  --space-1: 4px;
  --space-2: 6px;
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 24px;
  --section-y-desktop: 24px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 9999px;
  --elev-raised: 0 1px 2px rgba(20, 28, 48, 0.05), 0 1px 1px rgba(20, 28, 48, 0.04);
  --focus-ring: 0 0 0 3px oklch(0.42 0.14 262 / 0.35);
  --motion-fast: 120ms;
  --motion-base: 150ms;
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --container-max: 1320px;
  --container-gutter-desktop: 28px;
  --bg-soft: oklch(0.965 0.006 250);
  --line-2: oklch(0.86 0.012 255);
  --brand: oklch(0.42 0.14 262);
  --brand-ink: oklch(0.32 0.13 262);
  --brand-soft: oklch(0.96 0.025 260);
  --highlight: oklch(0.69 0.18 45);
  --highlight-ink: oklch(0.5 0.18 45);
  --highlight-soft: oklch(0.965 0.05 60);
  --success-soft: oklch(0.96 0.04 152);
  --warn-soft: oklch(0.97 0.04 80);
  --danger-soft: oklch(0.97 0.04 25);
  --control-height: 36px;
  --table-row-height: 36px;
  --radius-shell: 18px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-body); -webkit-font-smoothing: antialiased; }
main { max-width: var(--container-max); margin: 0 auto; padding: var(--section-y-desktop) var(--container-gutter-desktop); }
h1 { margin: 0 0 var(--space-2); font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700; letter-spacing: var(--tracking-display); line-height: var(--leading-tight); }
h2 { margin: var(--space-6) 0 var(--space-4); font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; line-height: var(--leading-tight); }
p { margin: 0 0 var(--space-4); color: var(--fg-2); }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3);
  height: var(--control-height); padding: 0 var(--space-5); border-radius: var(--radius-md);
  border: 1px solid transparent; font-family: inherit; font-size: 13px; font-weight: 600;
  white-space: nowrap; cursor: pointer;
  transition: transform var(--motion-base) var(--ease-standard), background var(--motion-base) var(--ease-standard), border-color var(--motion-base) var(--ease-standard), color var(--motion-base) var(--ease-standard);
}
.btn:hover { transform: translateY(-1px); }
.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.btn-pri { background: var(--brand); color: var(--accent-on); }
.btn-pri:hover { background: var(--brand-ink); }
.btn-hl { background: var(--highlight); color: var(--accent-on); }
.btn-hl:hover { background: var(--highlight-ink); }
.btn-out { background: var(--surface); color: var(--fg); border-color: var(--line-2); }
.btn-out:hover { border-color: var(--brand); color: var(--brand); }
.btn-ghost { background: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--bg-soft); color: var(--fg); }
.input {
  width: 100%; max-width: 320px; height: var(--control-height); padding: 0 var(--space-4);
  border: 1px solid var(--line-2); border-radius: var(--radius-md); background: var(--surface);
  font: inherit; font-size: 13px; color: var(--fg); outline: none;
  transition: border-color var(--motion-base) var(--ease-standard), box-shadow var(--motion-base) var(--ease-standard);
}
.input:focus-visible { border-color: var(--brand); box-shadow: var(--focus-ring); }
.tag {
  display: inline-flex; align-items: center; gap: var(--space-2); height: 22px; padding: 0 10px;
  border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: var(--text-xs);
  font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
}
.tag.ok { background: var(--success-soft); color: var(--success); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.err { background: var(--danger-soft); color: var(--danger); }
.tag.brd { background: var(--brand-soft); color: var(--brand-ink); }
.tag.hl { background: var(--highlight-soft); color: var(--highlight-ink); }
.card-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--elev-raised); max-width: 260px; }
.card-kpi .lb { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card-kpi .num { margin-top: var(--space-3); font-size: var(--text-3xl); font-weight: 800; line-height: 1.05; letter-spacing: var(--tracking-display); font-variant-numeric: tabular-nums; }
.card-kpi--featured { background: linear-gradient(135deg, var(--brand), var(--brand-ink)); border-color: transparent; color: var(--accent-on); }
.card-kpi--featured .lb { color: var(--accent-on); opacity: 0.78; }
.table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; max-width: 640px; }
.table th, .table td { padding: 0 var(--space-4); height: var(--table-row-height); border-bottom: 1px solid var(--border-soft); text-align: left; font-size: var(--text-sm); vertical-align: middle; }
.table th { background: var(--bg-soft); font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.table tr:hover td { background: var(--bg-soft); }
.table .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.table tr.row-selected td { background: var(--brand-soft); }
.table tr.row-selected td:first-child { box-shadow: inset 2px 0 0 var(--brand); }
.tabs { display: inline-flex; gap: 2px; padding: 0 var(--space-5); background: var(--surface); border-bottom: 1px solid var(--border); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
.tabs .t { display: inline-flex; align-items: center; padding: 10px var(--space-4); border: 0; background: transparent; border-bottom: 2px solid transparent; font-family: inherit; font-size: var(--text-sm); font-weight: 500; color: var(--fg-2); cursor: pointer; }
.tabs .t.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
@media (prefers-reduced-motion: reduce) {
  .btn, .input { transition: none; }
  .btn:hover { transform: none; }
}
</style>
</head>
<body>
<main>
  <h1>Components 组件预览</h1>
  <p>精简组件条带；完整状态与弹窗见包根 <span style="font-family: var(--font-mono); font-size: var(--text-sm);">../components.html</span>。</p>

  <h2>Buttons</h2>
  <div class="row">
    <button class="btn btn-pri" type="button">保存并检入</button>
    <button class="btn btn-hl" type="button">发起评估</button>
    <button class="btn btn-out" type="button">导出 Excel</button>
    <button class="btn btn-ghost" type="button">取消</button>
  </div>

  <h2>Inputs</h2>
  <input class="input" type="text" value="小鹏汽车工作量评估" aria-label="项目名称" />

  <h2>Status Tags</h2>
  <div class="row">
    <span class="tag brd">评审中</span>
    <span class="tag ok">已检入</span>
    <span class="tag warn">待复核</span>
    <span class="tag err">已锁定</span>
    <span class="tag hl">检出中</span>
  </div>

  <h2>KPI Card</h2>
  <div class="row" style="align-items: stretch;">
    <div class="card-kpi card-kpi--featured">
      <div class="lb">总工作量（人天）</div>
      <div class="num">1,284.5</div>
    </div>
    <div class="card-kpi">
      <div class="lb">功能点</div>
      <div class="num">412</div>
    </div>
  </div>

  <h2>Table Excerpt</h2>
  <table class="table">
    <thead>
      <tr><th>功能项</th><th>复杂度</th><th class="num">估算（人天）</th><th>状态</th></tr>
    </thead>
    <tbody>
      <tr class="row-selected"><td>登录与权限</td><td>中</td><td class="num">12.0</td><td><span class="tag ok">已检入</span></td></tr>
      <tr><td>评估模型配置</td><td>高</td><td class="num">36.5</td><td><span class="tag hl">检出中</span></td></tr>
      <tr><td>导出模板</td><td>低</td><td class="num">4.0</td><td><span class="tag err">锁定</span></td></tr>
    </tbody>
  </table>

  <h2>Tabs</h2>
  <div class="tabs" role="tablist">
    <button class="t on" role="tab" aria-selected="true">评估明细</button>
    <button class="t" role="tab" aria-selected="false">版本历史</button>
    <button class="t" role="tab" aria-selected="false">评审记录</button>
  </div>
</main>
</body>
</html>
