<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Datum · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../components.css" />
<style>
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--bg) 0%,var(--brand-soft) 100%);font-family:var(--font-sans)}
  .card{width:380px;max-width:100%;background:#fff;border-radius:var(--shell-radius);box-shadow:var(--shadow-3);padding:30px 32px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:grid;place-items:center;font-weight:800}
  .brand .tt{font-size:13.5px;font-weight:700}
  .brand .sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:2px}
  .card h3{margin:0 0 6px;font-size:18px;font-weight:700}
  .card .lead{font-size:12.5px;color:var(--ink-3);margin-bottom:20px}
  .card .stack{display:flex;flex-direction:column;gap:12px}
  .card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
  .card .row a{font-size:12px;color:var(--brand)}
  .card .btn{width:100%}
  .card .ft{text-align:center;margin-top:18px;font-size:12.5px;color:var(--ink-2)}
  .card .ft a{color:var(--brand);font-weight:600}

  .cb{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--ink-2)}
  .cb i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line-2);background:#fff;display:inline-block}

  .login-only,.register-only{display:none}
  .mode-login .login-only{display:block}
  .mode-register .register-only{display:block}
  .mode-login .login-only.row{display:flex}
  .mode-register .register-only.row{display:flex}
  .mode-login .login-only.btn{display:inline-flex}
  .mode-register .register-only.btn{display:inline-flex}

  .footer{position:fixed;bottom:16px;right:20px;font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
  @media (max-width:420px){body{padding-inline:16px}.card{padding:24px 20px}}
</style>
</head>
<body class="mode-login">
  <div class="card">
    <div class="brand">
      <div class="logo">W</div>
      <div>
        <div class="tt">Datum</div>
        <div class="sub">工作量评估系统</div>
      </div>
    </div>

    <h3 class="login-only">登录</h3>
    <h3 class="register-only">使用邀请码激活账号</h3>
    <p class="lead">请输入账号信息以继续</p>

    <form class="stack" onsubmit="return handleSubmit(event)">
      <input class="input register-only" type="email" placeholder="邮箱" autocomplete="email" />
      <input class="input" type="text" placeholder="用户名" autocomplete="username" />
      <input class="input foc" type="password" placeholder="密码" autocomplete="current-password" style="border-color:var(--brand);box-shadow:var(--shadow-focus)" />
      <input class="input register-only" type="text" placeholder="邀请码（必填）" autocomplete="off" />

      <div class="row login-only">
        <label class="cb"><i></i>记住 7 天</label>
        <a href="#">忘记密码?</a>
      </div>

      <button type="submit" class="btn btn-pri login-only">登录</button>
      <button type="submit" class="btn btn-pri register-only">激活账号</button>
    </form>

    <div class="ft login-only">
      还没有账号？<a href="#" onclick="toggleMode(event)">使用邀请码激活 →</a>
    </div>
    <div class="ft register-only">
      已有账号？<a href="#" onclick="toggleMode(event)">返回登录</a>
    </div>
  </div>

  <div class="footer">v 1.4.0 · © 2026 Datum</div>

  <script>
    function toggleMode(e){e.preventDefault();document.body.classList.toggle('mode-login');document.body.classList.toggle('mode-register')}
    function handleSubmit(e){e.preventDefault();alert('Phase A · 静态 mock，未接后端')}
  </script>
</body>
</html>
