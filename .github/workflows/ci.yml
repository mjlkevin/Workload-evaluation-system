name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  NODE_VERSION: 24

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: cd apps/api && npm run lint

  tsc:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check API
        run: cd apps/api && npx tsc --noEmit

  test-non-db:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test rules (no DB)
        run: npm run test:rules

      - name: Test agent (no DB)
        run: npm run test:agent

  # 前端门禁（阶段 1 合并排期裁决）：V2_PROTOTYPE 是当前唯一 Web 主线，
  # 其 356 个 vitest 用例与生产构建从未接入 CI（阶段 0 第 0 批清单第 5 项遗留）。
  # 前端不依赖数据库，独立 job，不挂 test-with-db。
  test-web:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/V2_PROTOTYPE/package-lock.json

      - name: Install web dependencies
        run: cd ui/V2_PROTOTYPE && npm ci

      - name: Test Web (V2_PROTOTYPE)
        run: npm run test:web

      - name: Build Web (V2_PROTOTYPE)
        run: npm run build:web

  test-with-db:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workload_eval_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      # C10（2026-08-25）：CI 配置对齐生产——五个存储域开关与 apps/api/.env 当前启用状态一致。
      # 此前 CI 无任何开关 → 全 JSON 缺省，而生产/dev 全开 → 全 PG：CI 持续验证 JSON 路径、
      # 实际运行 PG 路径，经选择器的装配层从未被 CI 验证。新增存储开关时必须同步本列表（§4.9 C10）。
      # S2b-2（2026-08-28）：WES_STORE_AI_SESSIONS_PG 已退役（ai-sessions 域恒 PG，JSON 路径已删）。
      # S6（2026-08-29）：WES_STORE_TEMPLATES_PG / WES_STORE_RULE_SETS_PG /
      # WES_STORE_KNOWLEDGE_PG 已退役（三域恒 PG，JSON 路径已删）——选择器已无分流分支，
      # 保留只会给出「切回 JSON 还能跑」的假安全感。
      WES_STORE_USERS_PG: "true"
      WES_STORE_SYSTEM_PG: "true"
      WES_STORE_TRACES_PG: "true"
      WES_STORE_VERSIONS_PG: "true"
      WES_STORE_TEAMS_PG: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:integration 归位到本 job：集成检查脚本会 spawn 真实 API 服务，
      # 依赖 DATABASE_URL（postgres service）与 db:migrate 已先执行。
      # 直接调用 npx tsx 避免「node dist 不存在 → MODULE_NOT_FOUND 假报错再 || 兜底」的
      # 信号噪音：真实迁移失败时真报错不能被假报错掩埋。
      - name: DB migrate
        run: cd apps/api && npx tsx src/db/migrate.cli.ts
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      # C10（2026-08-25）：CI 配置对齐生产——补 DB seed。集成检查脚本与生产一致地
      # 假定模板/规则种子数据存在（GET /templates 返回 list[0]）；此前 CI 走 JSON 缺省
      # 时由 JSON 文件承担种子角色，开关全开（PG）后空库无种子 → 集成检查失败。

      - name: Test AI
        run: cd apps/api && npm run test:ai
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test modules
        run: cd apps/api && npm run test:modules
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      # B1/B2/B3（2026-08-29 架构侧裁决 O1）：单文档表（templates / rule_sets 取「最近写入行」
      # 为活动文档）与无界读表（knowledge_entries.list() 全表读）的测试文件必须串行执行，
      # 否则并发写互相顶掉活动文档 / 打破「空表合法状态」断言。B3（S6）是 B1 的镜像形态：
      # 本步骤排在 DB seed 之前，两张单文档表此时是空的，依赖「读到活动文档」的用例
      # （modules.handlers.test.ts 的 getRuleSetMeta）必须自己种入 seed 源 fixture——
      # 而种入就是写入，又回到 B1 的争抢，故该文件也在本套件内。该约束是存储语义级的，
      # git 无冲突标记、tsc 也过，只在全量 CI 间歇性炸，故由
      # src/test-helpers/single-doc-serial-scope.drift.test.ts 自动守卫白名单。
      # 新增触碰这三张表的测试文件时，必须同时加进 test:modules:serial-store 与该守卫白名单。
      - name: Test modules (serial store scope)
        run: cd apps/api && npm run test:modules:serial-store
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      # DB seed 位置必须在 Test modules 之后、Test integration 之前：test:ai / test:modules
      # 的 truncateTestTables() 会整表清理（含 templates/rule_sets/system_configs），
      # 若在 migrate 后立即 seed，到 integration 时种子已被清空 → loadTemplate 500
      # （templates_status_not_200）。db:seed 幂等（缺失才插，onConflictDoNothing），
      # 重复执行不改变行数。
      - name: DB seed
        run: cd apps/api && npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test integration
        run: cd apps/api && npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      # 阶段 1 D16：test:harness(191 用例) 接入 CI，填补架构侧漏项。
      # 包含全部 durable-run 并发用例、确定性 claim 回归、退避序列与恢复上限。
      - name: Test harness
        run: cd apps/api && npm run test:harness
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

  docker-build:
    needs: [test-non-db, test-with-db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只在主干构建镜像（过期分支条件已清理；docker-build 指向 apps/api/Dockerfile 属事项 9）
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t wes-api -f apps/api/Dockerfile .
