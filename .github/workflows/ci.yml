name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  NODE_VERSION: 24

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: cd apps/api && npm run lint

  tsc:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check API
        run: cd apps/api && npx tsc --noEmit

  test-non-db:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test rules (no DB)
        run: npm run test:rules

  # 前端门禁（阶段 1 合并排期裁决）：V2_PROTOTYPE 是当前唯一 Web 主线，
  # 其 356 个 vitest 用例与生产构建从未接入 CI（阶段 0 第 0 批清单第 5 项遗留）。
  # 前端不依赖数据库，独立 job，不挂 test-with-db。
  test-web:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/V2_PROTOTYPE/package-lock.json

      - name: Install web dependencies
        run: cd ui/V2_PROTOTYPE && npm ci

      - name: Test Web (V2_PROTOTYPE)
        run: npm run test:web

      - name: Build Web (V2_PROTOTYPE)
        run: npm run build:web

  test-with-db:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workload_eval_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:integration 归位到本 job：集成检查脚本会 spawn 真实 API 服务，
      # 依赖 DATABASE_URL（postgres service）与 db:migrate 已先执行。
      # 直接调用 npx tsx 避免「node dist 不存在 → MODULE_NOT_FOUND 假报错再 || 兜底」的
      # 信号噪音：真实迁移失败时真报错不能被假报错掩埋。
      - name: DB migrate
        run: cd apps/api && npx tsx src/db/migrate.cli.ts
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test AI
        run: cd apps/api && npm run test:ai
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test modules
        run: cd apps/api && npm run test:modules
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test integration
        run: cd apps/api && npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

  docker-build:
    needs: [test-non-db, test-with-db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只在主干构建镜像（过期分支条件已清理；docker-build 指向 apps/api/Dockerfile 属事项 9）
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t wes-api -f apps/api/Dockerfile .
