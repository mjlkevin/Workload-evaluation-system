name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  NODE_VERSION: 24

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: cd apps/api && npm run lint
      # Lint Web 已暂停（apps/web W4 Vue 工作台已删除，新前端待基于 ui/V0_SAAS 重建）

  tsc:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check API
        run: cd apps/api && npx tsc --noEmit
      # Type-check Web 已暂停（apps/web 已删除）

  test-non-db:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test rules (no DB)
        run: npm run test:rules

  test-with-db:
    needs: tsc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workload_eval_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:integration 归位到本 job：集成检查脚本会 spawn 真实 API 服务，
      # 依赖 DATABASE_URL（postgres service）与 db:migrate 已先执行。
      - name: DB migrate
        run: cd apps/api && npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test AI
        run: cd apps/api && npm run test:ai
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test modules
        run: cd apps/api && npm run test:modules
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

      - name: Test integration
        run: cd apps/api && npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/workload_eval_test

  docker-build:
    needs: [test-non-db, test-with-db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只在主干构建镜像（过期分支条件已清理；docker-build 指向 apps/api/Dockerfile 属事项 9）
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t wes-api -f docker/Dockerfile.api .

      # Web image build 已暂停（apps/web 已删除）
      # ui/V0_SAAS 有自己的 Dockerfile，待新前端规划后接入 CI
